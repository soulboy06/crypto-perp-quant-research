policy_id = "R010-MARK-PROXY-v2"
parent_design = "R010-P1-v1"
user_authorized_proxy_exception = true
scenarios = ["spot", "ffill"]
phase = 1
strategy_accounts_per_scenario = 4
maximum_strategy_accounts = 24
parameter_search = false
select_proxy_by_returns = false
holdout_locked = true
formal_selection_eligible = false
phase_2_enabled = false
only_period = "2024-08"
gap_open_times_utc = ["2024-08-12T10:02:00Z", "2024-08-12T10:03:00Z"]
affected_symbols = ["SOLUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "LINKUSDT", "AVAXUSDT", "LTCUSDT"]
maximum_proxy_bars_per_symbol = 2
spot_source = "https://data.binance.vision/data/spot/monthly/klines"
spot_proxy_rule = "same_symbol_same_UTC_minute_observed_spot_OHLC_only_for_missing_mark_rows"
ffill_rule = "flat_OHLC_from_last_actual_closed_mark_before_gap_no_recursive_proxy_anchor"
maximum_ffill_age_at_open_seconds = 60
maximum_ffill_age_at_end_seconds = 120
neighbor_deviation_minutes_each_side = 30
deviation_metric = "absolute_observed_spot_close_divided_by_observed_mark_close_minus_one"
deviation_is = "observed_overlap_basis_not_actual_error_at_missing_mark_minutes"
stop_triggers = "original_futures_trade_price_unchanged"
proxy_used_for = "minute_mark_valuation_risk_checks_only_not_signal_or_trade_price"
missing_day_dropped = false
acceptance = "report_both_scenarios_require_original_gates_under_both_never_choose_better_proxy"
financial_materiality = "report_all_differences_apply_prespecified_funding_thresholds_never_select_better_case"

[funding_sensitivity]
multipliers = [0, 1, 2]
scope = "all_funding_cashflows_in_full_extension_window_both_payments_and_receipts"
unchanged_funding_risk_buffer = true
archive_only_whitelist = ["LTCUSDT/2025-11", "BNBUSDT/2025-12", "SOLUSDT/2025-12", "XRPUSDT/2025-12", "DOGEUSDT/2025-12", "ADAUSDT/2025-12", "LINKUSDT/2025-12", "AVAXUSDT/2025-12", "LTCUSDT/2025-12"]
archive_only_rest_verified = false
archive_only_is_provisional_until_sensitivity_review = true
maximum_end_equity_range_usdt = "0.10"
maximum_cagr_range = "0.001"
maximum_drawdown_range = "0.001"
require_same_trade_decisions_excluding_quantity_and_PnL = true
require_same_halts_liquidations_ambiguities_and_numeric_gate = true
materiality_is = "prespecified_research_screen_not_statistical_proof_of_data_accuracy"
