maximum_account_executions = 36
accounts_per_run = 4
cost_scenarios = ["base", "stress"]
proxy_scenarios = ["spot", "ffill"]
stop_after_prespecified_cases = true

[priority]
lookback_hours = 168
formula = "side_sign*sum_168_hourly_log_returns/(sample_stdev_168_hourly_log_returns*sqrt(168))"
side_sign_long = 1
side_sign_short = -1
effect = "sort_same_hour_existing_SIG001_entries_before_direction_slot_reservation"
exits_first = true
tie_break = "original_fixed_symbol_order"
missing_or_zero_volatility = "score_unavailable_place_last_in_original_order_do_not_drop_signal"
no_threshold = true
new_entry_filter = false
fit_parameters = false

[continuous]
id = "extension"
warmup_start = "2024-05-01T00:00:00Z"
start = "2024-07-01T00:00:00Z"
end_exclusive = "2026-01-01T00:00:00Z"
