policy_id = "R010-MARK-PROXY-v1"
parent_design = "R010-P1-v1"
user_authorized_proxy_exception = true
scenarios = ["spot", "ffill"]
phase = 1
strategy_accounts_per_scenario = 4
maximum_strategy_accounts = 8
parameter_search = false
select_proxy_by_returns = false
holdout_locked = true
formal_selection_eligible = false
phase_2_enabled = false
only_period = "2024-08"
